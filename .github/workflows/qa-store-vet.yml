name: QA store vet (temporary)
on:
  push:
    branches: [claude/project-thread-lj359d]
    paths: [scripts/qa/**, .github/workflows/qa-store-vet.yml]
permissions:
  contents: write
jobs:
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/qa/vet.mjs scripts/qa/stores-in.json scripts/qa/vet-out.json
      - uses: actions/upload-artifact@v4
        with: { name: vet-out, path: scripts/qa/vet-out.json }
      - run: |
          git config user.name "qa-bot"; git config user.email "qa@users.noreply.github.com"
          git add scripts/qa/vet-out.json
          git commit -m "QA store vet results" && git push || true
